<!DOCTYPE html>
<html lang="lt">
<head>
    <title>Register</title>
</head>
<body>
    <h1>Create an account</h1>

    <form action="/register" method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            minlength="8"
            required
        >

        <button type="submit">Register</button>
    </form>

    <a href="../static/login.html">Already have an account?</a>
</body>
</html>
