<!DOCTYPE html>
<html lang="lt">
<head>
    <title>Login</title>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="icon" type="image/x-icon" href="../res/icon.png">
    <link href="[https://fonts.googleapis.com/css2?family=VT323&display=swap](https://fonts.googleapis.com/css2?family=VT323&display=swap)" rel="stylesheet">
</head>
<body class="login-page">
    <div class="wrapper">
        <form action="/login" method="POST">
            <h1>Login</h1>

            <div class="input-box">
                <input type="text" name="username" placeholder="Username"
                required>
                <i class="bxf bx-user"></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password"
                required>
                <i class="bxf bx-lock"></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>

             <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account? <a href="../static/register.html">Register</a></p>
            </div>

    </form>
    </div>
</body>
</html>
