<!DOCTYPE html>
<html lang="lt">
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    <form action="/login" method="POST">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>
    </form>

    <a href="../static/register.html">Don't have an account?</a>
</body>
</html>
